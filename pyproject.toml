[project]
name = "constraint-il-transfer"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "robomimic",
    "robosuite",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "wandb>=0.28.0",
]

[project.optional-dependencies]
perception = [
    "cutie",
    "groundingdino",
    "segment-anything",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["empty2d_guidance*"]

[tool.uv.sources]
robosuite = { path = "third_party/robosuite", editable = true }
robomimic = { path = "third_party/robomimic", editable = true }
cutie = { git = "https://github.com/hkchengrex/Cutie.git", rev = "ec5cdd4cf16f75c73ad785a2f96fb97dbad4125a" }
groundingdino = { git = "https://github.com/IDEA-Research/GroundingDINO.git", rev = "856dde20aee659246248e20734ef9ba5214f5e44" }
segment-anything = { git = "https://github.com/facebookresearch/segment-anything.git", rev = "dca509fe793f601edb92606367a655c15ac00fdf" }
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }

[tool.uv]
no-build-isolation-package = ["groundingdino"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]
